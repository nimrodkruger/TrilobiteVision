<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrilobiteVision</title>
<style>
  :root {
    --bg:#0f1117; --panel:#171a23; --panel2:#1d212c; --line:#2a2f3d;
    --ink:#e7e9f0; --muted:#8990a6; --accent:#6ea8fe; --ok:#5fd18c; --warn:#ffb454; --err:#ff6b6b;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-size:13px; overflow:hidden;
         display:grid; grid-template-rows:auto 1fr auto; }

  header { display:flex; align-items:center; gap:14px; padding:9px 16px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:15px; font-weight:650; letter-spacing:.02em; }
  header .meta { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  header .spacer { margin-left:auto; }

  button { background:var(--accent); color:#08101f; border:0; border-radius:6px;
           padding:6px 11px; font-size:12px; font-weight:650; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:hover { filter:brightness(1.12); }
  button:disabled { opacity:.5; cursor:default; }

  /* Two camera columns. Each is its own grid: the image block is fixed, the
     controls block scrolls independently beneath it. That is what keeps the
     preview on screen while you tune a parameter far down the list. */
  main { display:grid; grid-template-columns:repeat(auto-fit, minmax(430px,1fr));
         gap:12px; padding:12px; min-height:0; }
  .cam { background:var(--panel); border:1px solid var(--line); border-radius:10px;
         display:grid; grid-template-rows:auto 1fr; min-height:0; overflow:hidden; }

  .viewport { border-bottom:1px solid var(--line); background:var(--panel2); }
  .viewport h2 { margin:0; padding:8px 12px; font-size:13px; font-weight:650;
                 display:flex; align-items:center; gap:9px; }
  .viewport h2 .sub { color:var(--muted); font-size:11px; font-weight:400;
                      font-family:ui-monospace,monospace; }
  .viewport h2 .stat { margin-left:auto; color:var(--muted); font-size:11px;
                       font-variant-numeric:tabular-nums; }
  .view { display:block; width:100%; height:40vh; object-fit:contain; background:#000; }

  .subaps { display:none; grid-template-columns:repeat(3,1fr); gap:6px; padding:6px 8px;
            border-top:1px solid var(--line); }
  .subaps.on { display:grid; }
  /* Capped height: the tiles are an alignment aid, and letting them grow with
     the column width steals room from the main preview, which is what you are
     actually looking at most of the time. */
  .subap img { width:100%; height:clamp(70px, 11vh, 130px); object-fit:contain;
               background:#000; border:1px solid var(--line); border-radius:4px;
               image-rendering:pixelated; }
  .subap .cap { font-size:10px; color:var(--muted); padding-top:3px; text-align:center;
                font-family:ui-monospace,monospace; }

  .actions { display:flex; gap:7px; padding:8px 10px; border-top:1px solid var(--line);
             align-items:center; flex-wrap:wrap; }
  .actions .note { font-size:11px; color:var(--muted); margin-left:auto;
                   font-family:ui-monospace,monospace; overflow:hidden;
                   text-overflow:ellipsis; white-space:nowrap; max-width:60%; }
  .actions .note.ok { color:var(--ok); } .actions .note.err { color:var(--err); }

  /* The scrolling half. */
  .controls { overflow-y:auto; overflow-x:hidden; padding:10px; min-height:0;
              display:flex; flex-direction:column; gap:10px; scrollbar-width:thin; }
  .panel { border:1px solid var(--line); border-radius:8px; background:var(--panel2); }
  .panel > .hdr { display:flex; align-items:center; gap:8px; padding:7px 10px;
                  border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  .panel > .hdr strong { font-size:12px; }
  .panel > .hdr .type { color:var(--muted); font-size:10px; font-family:ui-monospace,monospace; }
  .panel > .hdr .ms { margin-left:auto; color:var(--muted); font-size:10px;
                      font-variant-numeric:tabular-nums; }
  .panel > .hdr .chev { color:var(--muted); font-size:10px; width:10px; }
  .panel > .body { padding:6px 10px 9px; }
  .panel.collapsed > .body { display:none; }
  .panel.collapsed > .hdr { border-bottom:0; }

  .row { display:grid; grid-template-columns:104px 1fr 80px; align-items:center;
         gap:8px; margin:6px 0; }
  /* Box-only rows: the number field takes the slider's column too, so the
     layout stays a single tidy grid instead of leaving a gap. */
  .row.boxonly input[type=number] { grid-column:2 / span 2; text-align:left; }
  .row > label { color:var(--muted); font-size:11px; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .row input[type=range] { width:100%; accent-color:var(--accent); min-width:0; }
  .row input[type=number] { width:100%; background:var(--bg); color:var(--ink);
        border:1px solid var(--line); border-radius:4px; padding:3px 5px;
        font-size:11px; font-variant-numeric:tabular-nums; text-align:right; }
  .row input[type=number]:focus { outline:1px solid var(--accent); border-color:var(--accent); }
  .row input[type=number].bad { border-color:var(--err); color:var(--err); }
  /* A control the sensor is currently driving itself. Still editable -- typing
     in it takes manual control -- but visibly not yours right now. */
  .row.auto input[type=number] { color:var(--warn); border-style:dashed; }
  .row.auto > label::after { content:" (auto)"; color:var(--warn); }
  .row input[type=checkbox] { accent-color:var(--accent); justify-self:start;
                              width:15px; height:15px; }
  .empty { color:var(--muted); font-size:11px; padding:4px 0; }

  footer { padding:6px 16px; border-top:1px solid var(--line); background:var(--panel);
           color:var(--muted); font-family:ui-monospace,monospace; font-size:11px;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  footer.ok { color:var(--ok); } footer.err { color:var(--err); }
</style>
</head>
<body>

<header>
  <h1>TrilobiteVision</h1>
  <span class="meta" id="session">&mdash;</span>
  <span class="spacer"></span>
  <button id="all-raw">Save raw — both</button>
  <button class="ghost" id="all-view">Save view — both</button>
</header>

<main id="cams"></main>
<footer id="log">&nbsp;</footer>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const SUBAPS = ["top_right", "centre", "bottom_left"];

/* Sensor control rows, per camera, so the status poll can write live values
   back into them. Under auto-exposure the box must track what the sensor
   actually chose -- that number is the whole reason to run AE at all: you
   watch where it settles, then switch to manual and it stays there. */
const SENSOR_ROWS = {};
const AUTO_DRIVEN = ["ExposureTime", "AnalogueGain"];

function syncSensorRows(camId, effective, live) {
  const rows = SENSOR_ROWS[camId];
  if (!rows) return;
  const ae = live.AeEnable ?? effective.AeEnable ?? false;
  if (rows.AeEnable && rows.AeEnable.sync) rows.AeEnable.sync(ae);
  for (const name of AUTO_DRIVEN) {
    const row = rows[name];
    if (!row) continue;
    row.classList.toggle("auto", !!ae);
    const focused = row.contains(document.activeElement);
    if (effective[name] !== undefined && !focused) {
      // An authoritative value from a control response -- notably the exposure
      // that was pinned when AE was switched off. Takes precedence over the
      // status poll, which may still be carrying the previous frame.
      row.sync(effective[name]);
    } else if (ae && live[name] !== undefined && !focused) {
      // While AE runs, mirror what the sensor actually chose. Skipped when the
      // field has focus: overwriting it would fight the user mid-edit.
      row.sync(live[name]);
    }
  }
}

function log(msg, cls = "") { const e = $("#log"); e.textContent = msg || " "; e.className = cls; }
function note(camId, msg, cls = "") {
  const e = document.querySelector(`[data-note="${camId}"]`);
  if (e) { e.textContent = msg; e.className = "note " + cls; }
  log(msg, cls);
}

async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 250)}`);
  return r.json();
}
async function jsend(url, body, method = "POST") {
  const r = await fetch(url, {
    method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await r.text();
  if (!r.ok) throw new Error(`${r.status} ${text.slice(0, 250)}`);
  return text ? JSON.parse(text) : {};
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function fmt(v, isInt) {
  if (v === null || v === undefined) return "";
  return isInt ? String(Math.round(v)) : String(Number(parseFloat(v).toFixed(4)));
}

/* ---------------------------------------------------------------------------
   One control row: slider AND number box, kept in sync, either can commit.

   The number box exists because a slider cannot express "pitch = 20.375", and
   that is exactly the precision MLA alignment needs. The slider is for
   sweeping and watching the image; the box is for landing on a value.

   Commit rules: the slider commits continuously but debounced, so you can drag
   and watch. The box commits on Enter or blur, so half-typed numbers are never
   sent. Whatever the SERVER returns is written back into both, so a value that
   was clamped or rejected is visible rather than silently ignored -- which is
   the failure mode that makes a control look dead.
--------------------------------------------------------------------------- */
function makeRow(key, spec, value, commit) {
  const row = document.createElement("div");
  row.className = "row";

  const label = document.createElement("label");
  label.textContent = spec.title || key;
  if (spec.description) label.title = spec.description;
  row.appendChild(label);

  if (spec.type === "boolean") {
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!value;
    cb.onchange = async () => {
      try { await commit(key, cb.checked); }
      catch (e) { cb.checked = !cb.checked; }
    };
    row.appendChild(cb);
    row.appendChild(document.createElement("span"));
    row.sync = v => { cb.checked = !!v; };
    return row;
  }

  const isInt = spec.type === "integer";
  const hasMin = (spec.minimum ?? spec.exclusiveMinimum) !== undefined;
  const hasMax = (spec.maximum ?? spec.exclusiveMaximum) !== undefined;
  const min = spec.minimum ?? spec.exclusiveMinimum ?? 0;
  const max = spec.maximum ?? spec.exclusiveMaximum ?? 1;

  /* Whether this parameter gets a slider at all. Three reasons it should not:

     1. The parameter declares widget:"box" -- e.g. grid line width over
        0.5-6 px, where a slider is all travel and no precision.
     2. It has no finite bound. A saturation level declared `ge=0` with no
        maximum was getting a 0-1 slider with the value sitting at 250,
        permanently pinned off the end. A bar with no upper bound is not a
        bar, it is a lie.
     3. Its range spans orders of magnitude. Exposure time runs 30 us to
        100 ms; the useful band is a narrow slice of that, and a linear drag
        cannot resolve it. (A log slider would work, but the box is simpler
        and you already know the number you want.) */
  const wideRange = min >= 0 && max > 0 && max / Math.max(min, 1) > 500;
  const boxOnly = spec.widget === "box" || !hasMin || !hasMax || wideRange;

  const slider = document.createElement("input");
  slider.type = "range"; slider.min = min; slider.max = max;
  // step="any" for floats. A computed step such as (max-min)/1000 produces
  // values the browser then rejects as not on the step grid, because
  // 625 * 0.008 is not exactly 5 in binary floating point -- the slider goes
  // dead for no visible reason. Continuous is also what you want for sweeping.
  slider.step = isInt ? 1 : "any";
  slider.value = value;

  const box = document.createElement("input");
  box.type = "number";
  if (hasMin) box.min = min;
  if (hasMax) box.max = max;
  box.step = isInt ? 1 : "any";
  box.value = fmt(value, isInt);

  function setBoth(v) {
    if (!boxOnly) slider.value = v;
    box.value = fmt(v, isInt);
    box.classList.remove("bad");
  }

  // Guard against re-sending a value that is already in force. Three events
  // can each fire for one edit (input, change, blur) and the box also commits
  // on a debounce, so without this a single keystroke can post four times.
  let inFlight = null;
  async function submit(v) {
    if (!Number.isFinite(v)) { box.classList.add("bad"); return; }
    if (v === inFlight) return;
    inFlight = v;
    // Out-of-range values are sent anyway: the server owns validation and its
    // 422 states the real limit. Clamping here would hide the limit behind a
    // silent correction, which is how a control comes to look broken.
    try {
      const got = await commit(key, v);
      setBoth(got === undefined || got === null ? v : got);
    } catch (e) {
      box.classList.add("bad");
    } finally {
      if (inFlight === v) inFlight = null;
    }
  }
  const readBox = () => (isInt ? parseInt(box.value, 10) : parseFloat(box.value));

  const pushSlider = debounce(v => submit(v), 100);
  slider.oninput = () => {
    const v = isInt ? parseInt(slider.value, 10) : parseFloat(slider.value);
    box.value = fmt(v, isInt);
    pushSlider(v);
  };

  // The box commits on three paths on purpose. `change` alone is not enough:
  // it does not fire for a pasted or scripted value, and a user who types a
  // number and then walks away without pressing Enter would see nothing
  // happen. Debounced `input` covers typing, Enter and blur cover the rest.
  const pushBox = debounce(() => submit(readBox()), 500);
  box.oninput = () => { box.classList.remove("bad"); pushBox(); };
  box.onchange = () => submit(readBox());
  box.onblur = () => submit(readBox());
  box.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); box.blur(); } };

  if (boxOnly) {
    row.classList.add("boxonly");
  } else {
    row.appendChild(slider);
  }
  row.appendChild(box);
  row.sync = setBoth;
  return row;
}

function makePanel(title, type, bodyEl, collapsed = false) {
  const p = document.createElement("div");
  p.className = "panel" + (collapsed ? " collapsed" : "");
  const hdr = document.createElement("div");
  hdr.className = "hdr";
  hdr.innerHTML = `<span class="chev">${collapsed ? "▸" : "▾"}</span>` +
                  `<strong></strong><span class="type"></span><span class="ms"></span>`;
  hdr.querySelector("strong").textContent = title;
  hdr.querySelector(".type").textContent = type;
  hdr.onclick = () => {
    p.classList.toggle("collapsed");
    hdr.querySelector(".chev").textContent = p.classList.contains("collapsed") ? "▸" : "▾";
  };
  const body = document.createElement("div");
  body.className = "body";
  body.appendChild(bodyEl);
  p.append(hdr, body);
  return p;
}

/* -------------------------------------------------------------------------- */

async function buildSensorPanel(camId) {
  const body = document.createElement("div");
  let data;
  try { data = await jget(`/api/controls/${camId}`); } catch { data = { spec: {} }; }

  // libcamera advertises dozens of controls; all but a few are noise for this
  // rig and would bury the ones that matter.
  const WANTED = ["ExposureTime", "AnalogueGain", "AeEnable"];
  const spec = data.spec || {};
  const names = WANTED.filter(n => n in spec);
  if (!names.length) {
    body.innerHTML = `<div class="empty">This backend advertises no sensor controls.</div>`;
    return makePanel("Sensor", "driver", body, true);
  }
  const commit = async (key, v) => {
    try {
      const r = await jsend(`/api/controls/${camId}`, { controls: { [key]: v } });
      // The server echoes what the source settled on. Turning auto-exposure
      // off pins the exposure AE had converged to, and setting an exposure by
      // hand turns AE off -- both change controls the caller did not name, so
      // push the whole effective set back into the rows.
      syncSensorRows(camId, r.effective || {}, r.live || {});
      note(camId, `sensor ${key} = ${v}`, "ok");
      return (r.effective || {})[key] ?? v;
    } catch (e) { note(camId, `sensor ${key}: ${e.message}`, "err"); throw e; }
  };
  SENSOR_ROWS[camId] = {};
  for (const n of names) {
    const s = spec[n];
    const current = (data.requested || {})[n] ?? s.default ?? s.minimum ?? 0;
    const row = makeRow(n, s, current, commit);
    SENSOR_ROWS[camId][n] = row;
    body.appendChild(row);
  }
  return makePanel("Sensor", "driver", body, false);
}

async function buildPipelinePanels(camId, host) {
  const stages = await jget(`/api/pipeline/${camId}`);
  for (const st of stages) {
    const body = document.createElement("div");
    const props = (st.schema && st.schema.properties) || {};
    const commit = async (key, v) => {
      try {
        const got = await jsend(`/api/pipeline/${camId}/${st.name}`, { values: { [key]: v } });
        note(camId, `${st.name}.${key} = ${got[key]}`, "ok");
        if (st.type === "mla_grid_overlay") refreshSubaps(camId);
        return got[key];
      } catch (e) {
        note(camId, `${st.name}.${key}: ${e.message}`, "err");
        throw e;
      }
    };
    for (const [key, spec] of Object.entries(props)) {
      body.appendChild(makeRow(key, spec, st.values[key], commit));
    }
    const panel = makePanel(st.name, st.type, body, false);
    panel.dataset.stage = st.name;
    panel.dataset.cam = camId;
    host.appendChild(panel);
  }
}

async function refreshSubaps(camId) {
  const strip = document.querySelector(`[data-subaps="${camId}"]`);
  if (!strip) return;
  let info;
  try { info = await jget(`/api/subapertures/${camId}`); } catch { return; }
  if (!info.available || !info.enabled) { strip.classList.remove("on"); return; }
  strip.classList.add("on");
  for (const v of SUBAPS) {
    const cap = strip.querySelector(`[data-cap-for="${v}"]`);
    const view = info.views[v];
    if (cap) {
      cap.textContent = view
        ? `${v.replace("_", " ")} (${view.index[0]}, ${view.index[1]})`
        : v.replace("_", " ");
    }
  }
}

async function build() {
  const cams = await jget("/api/cameras");
  const root = $("#cams");
  root.innerHTML = "";

  for (const cam of cams) {
    const card = document.createElement("section");
    card.className = "cam";

    const vp = document.createElement("div");
    vp.className = "viewport";
    vp.innerHTML = `
      <h2><span class="ttl"></span>
        <span class="sub"></span>
        <span class="stat" data-fps="${cam.cam_id}">&mdash;</span>
      </h2>
      <img class="view" src="/stream/${cam.cam_id}.mjpg" alt="preview">
      <div class="subaps" data-subaps="${cam.cam_id}">
        ${SUBAPS.map(v => `
          <div class="subap">
            <img data-tile="${cam.cam_id}/${v}" alt="${v}">
            <div class="cap" data-cap-for="${v}">${v.replace("_", " ")}</div>
          </div>`).join("")}
      </div>
      <div class="actions">
        <button data-save="raw"  data-cam="${cam.cam_id}">Save raw</button>
        <button class="ghost" data-save="view" data-cam="${cam.cam_id}">Save view</button>
        <span class="note" data-note="${cam.cam_id}"></span>
      </div>`;
    vp.querySelector(".ttl").textContent = cam.label || cam.cam_id;
    vp.querySelector(".sub").textContent = `${cam.cam_id} · ${cam.backend}`;

    const controls = document.createElement("div");
    controls.className = "controls";

    card.append(vp, controls);
    root.appendChild(card);

    controls.appendChild(await buildSensorPanel(cam.cam_id));
    await buildPipelinePanels(cam.cam_id, controls);
    refreshSubaps(cam.cam_id);
  }

  root.addEventListener("click", async ev => {
    const btn = ev.target.closest("[data-save]");
    if (!btn) return;
    const kind = btn.dataset.save, cam = btn.dataset.cam;
    note(cam, `saving ${kind}…`);
    btn.disabled = true;
    try {
      const r = await jsend(`/api/capture/${cam}/${kind}`);
      note(cam, `${r.file}  ${r.shape.join("×")} ${r.dtype}`, "ok");
    } catch (e) {
      note(cam, `save ${kind} failed: ${e.message}`, "err");
    } finally {
      btn.disabled = false;
    }
  });
}

async function saveAll(kind, btn) {
  // Feedback lands in three places on purpose: the button itself (so the
  // click is visibly acknowledged even before the write finishes), each
  // camera's own note line (so you see per-camera success or failure next to
  // the image it came from), and the footer (the full detail). A header
  // button whose result only appears in a footer reads as doing nothing.
  const original = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  for (const el of document.querySelectorAll("[data-note]")) {
    el.textContent = `saving ${kind}…`; el.className = "note";
  }
  log(`saving ${kind} on all cameras…`);
  try {
    const r = await jsend(`/api/capture-all/${kind}`);
    const failed = Object.values(r).some(v => v.error);
    for (const [cam, v] of Object.entries(r)) {
      note(cam, v.error ? `save ${kind} failed: ${v.error}`
                        : `${v.file}  ${v.shape.join("×")} ${v.dtype}`,
           v.error ? "err" : "ok");
    }
    log(Object.entries(r).map(([k, v]) => `${k}: ${v.file || v.error}`).join("   |   "),
        failed ? "err" : "ok");
    if (btn) { btn.textContent = failed ? "Save failed" : "Saved ✓"; }
  } catch (e) {
    log(e.message, "err");
    for (const el of document.querySelectorAll("[data-note]")) {
      el.textContent = e.message; el.className = "note err";
    }
    if (btn) btn.textContent = "Save failed";
  } finally {
    if (btn) setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 1400);
  }
}
$("#all-raw").onclick = ev => saveAll("raw", ev.currentTarget);
$("#all-view").onclick = ev => saveAll("view", ev.currentTarget);

/* Sub-aperture tiles are POLLED, not streamed.

   A browser allows roughly six concurrent connections per origin and an MJPEG
   stream holds one open indefinitely. Two cameras with a main stream plus
   three tile streams each is eight -- past the limit, at which point every
   fetch() on this page, including every button press, queues behind them and
   never returns. That failure looks exactly like dead controls.

   One persistent stream per camera for the main preview; everything else is a
   short request that completes and gives its connection back. */
const TILE_HZ = 4;
function pollTiles() {
  for (const img of document.querySelectorAll("[data-tile]")) {
    // Skip while a previous load is still in flight, so a slow encode cannot
    // build a backlog of requests.
    if (img.dataset.busy === "1") continue;
    const strip = img.closest(".subaps");
    if (!strip || !strip.classList.contains("on")) continue;
    img.dataset.busy = "1";
    const done = () => { img.dataset.busy = "0"; };
    img.onload = done;
    img.onerror = done;   // 204 while the lenslet is off-sensor: keep the last frame
    img.src = `/subaperture/${img.dataset.tile}.jpg?t=${Date.now()}`;
  }
  setTimeout(pollTiles, 1000 / TILE_HZ);
}

let tick = 0;
async function poll() {
  try {
    const s = await jget("/api/status");
    $("#session").textContent =
      `${s.session_dir}   up ${s.uptime_s}s` +
      (s.state_file ? `   state: ${s.state_file.split(/[\\/]/).pop()}` : "");
    for (const c of s.cameras) {
      const el = document.querySelector(`[data-fps="${c.cam_id}"]`);
      if (el) {
        el.textContent = `${c.fps} fps  ${c.frames} frames` + (c.errors ? `  ${c.errors} ERR` : "");
        el.style.color = c.errors ? "var(--err)" : "";
      }
      if (c.live) syncSensorRows(c.cam_id, {}, c.live);
    }
    // Sub-aperture indices shift as pitch changes; refresh captions at a low
    // rate rather than on every keystroke.
    if (++tick % 3 === 0) s.cameras.forEach(c => refreshSubaps(c.cam_id));
  } catch (e) { /* transient; the streams themselves show a stall */ }
  setTimeout(poll, 1000);
}

build().then(() => { poll(); pollTiles(); }).catch(e => log("startup: " + e.message, "err"));
</script>
</body>
</html>
