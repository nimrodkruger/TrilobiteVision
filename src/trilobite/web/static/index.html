<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrilobiteVision</title>
<style>
  :root {
    --bg:#0f1117; --panel:#171a23; --panel2:#1d212c; --line:#2a2f3d;
    --ink:#e7e9f0; --muted:#8990a6; --accent:#6ea8fe; --ok:#5fd18c; --warn:#ffb454; --err:#ff6b6b;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-size:13px; overflow:hidden;
         display:grid; grid-template-rows:auto 1fr auto; }

  header { display:flex; align-items:center; gap:14px; padding:9px 16px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:15px; font-weight:650; letter-spacing:.02em; }
  header .meta { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  header .spacer { margin-left:auto; }

  button { background:var(--accent); color:#08101f; border:0; border-radius:6px;
           padding:6px 11px; font-size:12px; font-weight:650; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:hover { filter:brightness(1.12); }
  button:disabled { opacity:.5; cursor:default; }

  /* Two camera columns. Each is its own grid: the image block is fixed, the
     controls block scrolls independently beneath it. That is what keeps the
     preview on screen while you tune a parameter far down the list. */
  main { display:grid; grid-template-columns:repeat(auto-fit, minmax(430px,1fr));
         gap:12px; padding:12px; min-height:0; }
  .cam { background:var(--panel); border:1px solid var(--line); border-radius:10px;
         display:grid; grid-template-rows:auto 1fr; min-height:0; overflow:hidden; }

  .viewport { border-bottom:1px solid var(--line); background:var(--panel2); }
  .viewport h2 { margin:0; padding:8px 12px; font-size:13px; font-weight:650;
                 display:flex; align-items:center; gap:9px; }
  .viewport h2 .sub { color:var(--muted); font-size:11px; font-weight:400;
                      font-family:ui-monospace,monospace; }
  .viewport h2 .stat { margin-left:auto; color:var(--muted); font-size:11px;
                       font-variant-numeric:tabular-nums; }
  .view { display:block; width:100%; height:40vh; object-fit:contain; background:#000; }

  .subaps { display:none; grid-template-columns:repeat(3,1fr); gap:6px; padding:6px 8px;
            border-top:1px solid var(--line); }
  .subaps.on { display:grid; }
  /* Capped height: the tiles are an alignment aid, and letting them grow with
     the column width steals room from the main preview, which is what you are
     actually looking at most of the time. */
  .subap img { width:100%; height:clamp(70px, 11vh, 130px); object-fit:contain;
               background:#000; border:1px solid var(--line); border-radius:4px;
               image-rendering:pixelated; }
  .subap .cap { font-size:10px; color:var(--muted); padding-top:3px; text-align:center;
                font-family:ui-monospace,monospace; }

  .actions { display:flex; gap:7px; padding:8px 10px; border-top:1px solid var(--line);
             align-items:center; flex-wrap:wrap; }
  .actions .note { font-size:11px; color:var(--muted); margin-left:auto;
                   font-family:ui-monospace,monospace; overflow:hidden;
                   text-overflow:ellipsis; white-space:nowrap; max-width:60%; }
  .actions .note.ok { color:var(--ok); } .actions .note.err { color:var(--err); }

  /* The scrolling half. */
  .controls { overflow-y:auto; overflow-x:hidden; padding:10px; min-height:0;
              display:flex; flex-direction:column; gap:10px; scrollbar-width:thin; }
  .panel { border:1px solid var(--line); border-radius:8px; background:var(--panel2); }
  .panel > .hdr { display:flex; align-items:center; gap:8px; padding:7px 10px;
                  border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  .panel > .hdr strong { font-size:12px; }
  .panel > .hdr .type { color:var(--muted); font-size:10px; font-family:ui-monospace,monospace; }
  .panel > .hdr .ms { margin-left:auto; color:var(--muted); font-size:10px;
                      font-variant-numeric:tabular-nums; }
  .panel > .hdr .chev { color:var(--muted); font-size:10px; width:10px; }
  .panel > .body { padding:6px 10px 9px; }
  .panel.collapsed > .body { display:none; }
  .panel.collapsed > .hdr { border-bottom:0; }

  .row { display:grid; grid-template-columns:104px 1fr 80px; align-items:center;
         gap:8px; margin:6px 0; }
  /* Box-only rows: the number field takes the slider's column too, so the
     layout stays a single tidy grid instead of leaving a gap. */
  .row.boxonly input[type=number] { grid-column:2 / span 2; text-align:left; }
  .row > label { color:var(--muted); font-size:11px; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .row input[type=range] { width:100%; accent-color:var(--accent); min-width:0; }
  .row input[type=number] { width:100%; background:var(--bg); color:var(--ink);
        border:1px solid var(--line); border-radius:4px; padding:3px 5px;
        font-size:11px; font-variant-numeric:tabular-nums; text-align:right; }
  .row input[type=number]:focus { outline:1px solid var(--accent); border-color:var(--accent); }
  .row input[type=number].bad { border-color:var(--err); color:var(--err); }
  /* A control the sensor is currently driving itself. Still editable -- typing
     in it takes manual control -- but visibly not yours right now. */
  .row.auto input[type=number] { color:var(--warn); border-style:dashed; }
  .row.auto > label::after { content:" (auto)"; color:var(--warn); }
  .row input[type=checkbox] { accent-color:var(--accent); justify-self:start;
                              width:15px; height:15px; }
  .empty { color:var(--muted); font-size:11px; padding:4px 0; }

  /* --- mode switch ------------------------------------------------------ */
  .modes { display:flex; gap:0; border:1px solid var(--line); border-radius:7px;
           overflow:hidden; }
  .modes button { background:transparent; color:var(--muted); border:0;
                  border-radius:0; padding:5px 13px; font-weight:600; }
  .modes button.on { background:var(--accent); color:#08101f; }

  /* --- calibration dashboard -------------------------------------------- */
  main.cal { grid-template-columns:352px 1fr; align-items:stretch; }
  .rail { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          overflow-y:auto; padding:10px; display:flex; flex-direction:column;
          gap:10px; min-height:0; scrollbar-width:thin; }
  .stage { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:12px; overflow-y:auto; min-height:0; display:flex;
           flex-direction:column; gap:12px; scrollbar-width:thin; }

  .derived { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
             gap:8px; }
  .kpi { background:var(--panel2); border:1px solid var(--line); border-radius:8px;
         padding:8px 10px; }
  .kpi .k { font-size:10px; color:var(--muted); text-transform:uppercase;
            letter-spacing:.04em; }
  .kpi .v { font-size:17px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .kpi .u { font-size:10px; color:var(--muted); margin-left:3px; }
  .kpi.ok  .v { color:var(--ok); }
  .kpi.warn .v { color:var(--warn); }
  .kpi.err  .v { color:var(--err); }
  .verdict { font-size:11px; color:var(--muted); line-height:1.5; }
  .verdict.warn { color:var(--warn); } .verdict.err { color:var(--err); }

  .checks { display:flex; flex-direction:column; gap:4px; }
  .chk { display:flex; gap:8px; align-items:baseline; font-size:11px;
         font-family:ui-monospace,monospace; }
  .chk .mark { width:14px; flex:none; }
  .chk.pass .mark { color:var(--ok); }
  .chk.warn .mark { color:var(--warn); }
  .chk.fail .mark { color:var(--err); }
  .chk.pass { color:var(--muted); }
  .chk.warn { color:var(--warn); }
  .chk.fail { color:var(--err); }

  .calviews { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .calview { background:var(--panel2); border:1px solid var(--line); border-radius:8px;
             overflow:hidden; }
  .calview h3 { margin:0; padding:6px 10px; font-size:12px; font-weight:650;
                border-bottom:1px solid var(--line); display:flex; gap:8px; }
  .calview h3 .stat { margin-left:auto; color:var(--muted); font-size:10px;
                      font-weight:400; font-variant-numeric:tabular-nums; }
  .calview img { display:block; width:100%; height:30vh; object-fit:contain;
                 background:#000; }

  .sectitle { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
              color:var(--muted); font-weight:650; }
  .startbar { display:flex; gap:9px; align-items:center; flex-wrap:wrap;
              border-top:1px solid var(--line); padding-top:10px; }
  .startbar .why { font-size:11px; color:var(--muted); font-family:ui-monospace,monospace; }
  .frozen { font-size:11px; color:var(--muted); font-family:ui-monospace,monospace;
            line-height:1.6; }

  /* --- storage devices --------------------------------------------------- */
  .dev { border:1px solid var(--line); border-radius:7px; background:var(--bg);
         padding:7px 9px; margin:6px 0; display:grid; gap:5px; }
  .dev.active { border-color:var(--accent); }
  .dev .top { display:flex; align-items:baseline; gap:8px; }
  .dev .name { font-weight:650; font-size:12px; }
  .dev .tag { font-size:9px; text-transform:uppercase; letter-spacing:.05em;
              border:1px solid var(--line); border-radius:4px; padding:1px 4px;
              color:var(--muted); }
  .dev .tag.rm { color:var(--warn); border-color:var(--warn); }
  .dev .tag.on { color:var(--accent); border-color:var(--accent); }
  .dev .path { font-family:ui-monospace,monospace; font-size:10px; color:var(--muted);
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dev .bar { height:5px; border-radius:3px; background:var(--panel2); overflow:hidden; }
  .dev .bar > i { display:block; height:100%; background:var(--accent); }
  .dev .bar > i.full { background:var(--err); }
  .dev .foot { display:flex; align-items:center; gap:8px; }
  .dev .foot .cap { font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums;
                    margin-right:auto; }
  .dev button { padding:3px 9px; font-size:11px; }
  .notes { font-family:ui-monospace,monospace; font-size:10px; color:var(--muted);
           line-height:1.6; max-height:80px; overflow-y:auto; }

  /* --- detection coverage -------------------------------------------------
     One cell per lattice position, laid out as the array is. Capped in size:
     it is a glance, not a picture, and at full column width it would push the
     live views off the screen -- which are the thing you aim the board with. */
  .cov { display:grid; gap:1px; margin:5px 0; max-width:230px; }
  .cov i { display:block; aspect-ratio:1; border-radius:1px; background:#1a1d26; }
  .cov i.miss  { background:#4a2330; }   /* examined, found nothing */
  .cov i.found { background:var(--ok); }
  .cov i.cross { background:var(--accent); }
  .covkey { font-size:9px; color:var(--muted); display:flex; gap:9px; align-items:center; }
  .covkey i { width:8px; height:8px; border-radius:2px; display:inline-block;
              vertical-align:-1px; margin-right:3px; }
  .detstat { font-family:ui-monospace,monospace; font-size:11px; color:var(--muted);
             font-variant-numeric:tabular-nums; }
  .detstat b { color:var(--ok); font-weight:650; }
  .detstat.idle b { color:var(--muted); }

  footer { padding:6px 16px; border-top:1px solid var(--line); background:var(--panel);
           color:var(--muted); font-family:ui-monospace,monospace; font-size:11px;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  footer.ok { color:var(--ok); } footer.err { color:var(--err); }
</style>
</head>
<body>

<header>
  <h1>TrilobiteVision</h1>
  <span class="meta" id="session">&mdash;</span>
  <span class="spacer"></span>
  <span class="modes">
    <button id="mode-live" class="on">Imaging</button>
    <button id="mode-cal">Calibration</button>
  </span>
  <span id="live-actions">
    <button id="all-raw">Save raw — both</button>
    <button class="ghost" id="all-view">Save view — both</button>
  </span>
</header>

<main id="cams"></main>
<footer id="log">&nbsp;</footer>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const SUBAPS = ["top_right", "centre", "bottom_left"];

/* Sensor control rows, per camera, so the status poll can write live values
   back into them. Under auto-exposure the box must track what the sensor
   actually chose -- that number is the whole reason to run AE at all: you
   watch where it settles, then switch to manual and it stays there. */
const SENSOR_ROWS = {};
const AUTO_DRIVEN = ["ExposureTime", "AnalogueGain"];

function syncSensorRows(camId, effective, live) {
  const rows = SENSOR_ROWS[camId];
  if (!rows) return;
  const ae = live.AeEnable ?? effective.AeEnable ?? false;
  if (rows.AeEnable && rows.AeEnable.sync) rows.AeEnable.sync(ae);
  for (const name of AUTO_DRIVEN) {
    const row = rows[name];
    if (!row) continue;
    row.classList.toggle("auto", !!ae);
    const focused = row.contains(document.activeElement);
    if (effective[name] !== undefined && !focused) {
      // An authoritative value from a control response -- notably the exposure
      // that was pinned when AE was switched off. Takes precedence over the
      // status poll, which may still be carrying the previous frame.
      row.sync(effective[name]);
    } else if (ae && live[name] !== undefined && !focused) {
      // While AE runs, mirror what the sensor actually chose. Skipped when the
      // field has focus: overwriting it would fight the user mid-edit.
      row.sync(live[name]);
    }
  }
}

function log(msg, cls = "") { const e = $("#log"); e.textContent = msg || " "; e.className = cls; }
function note(camId, msg, cls = "") {
  const e = document.querySelector(`[data-note="${camId}"]`);
  if (e) { e.textContent = msg; e.className = "note " + cls; }
  log(msg, cls);
}

async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 250)}`);
  return r.json();
}
async function jsend(url, body, method = "POST") {
  const r = await fetch(url, {
    method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await r.text();
  if (!r.ok) throw new Error(`${r.status} ${text.slice(0, 250)}`);
  return text ? JSON.parse(text) : {};
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function fmt(v, isInt) {
  if (v === null || v === undefined) return "";
  return isInt ? String(Math.round(v)) : String(Number(parseFloat(v).toFixed(4)));
}

/* ---------------------------------------------------------------------------
   One control row: slider AND number box, kept in sync, either can commit.

   The number box exists because a slider cannot express "pitch = 20.375", and
   that is exactly the precision MLA alignment needs. The slider is for
   sweeping and watching the image; the box is for landing on a value.

   Commit rules: the slider commits continuously but debounced, so you can drag
   and watch. The box commits on Enter or blur, so half-typed numbers are never
   sent. Whatever the SERVER returns is written back into both, so a value that
   was clamped or rejected is visible rather than silently ignored -- which is
   the failure mode that makes a control look dead.
--------------------------------------------------------------------------- */
function makeRow(key, spec, value, commit) {
  const row = document.createElement("div");
  row.className = "row";

  const label = document.createElement("label");
  label.textContent = spec.title || key;
  if (spec.description) label.title = spec.description;
  row.appendChild(label);

  if (spec.type === "boolean") {
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!value;
    cb.onchange = async () => {
      try { await commit(key, cb.checked); }
      catch (e) { cb.checked = !cb.checked; }
    };
    row.appendChild(cb);
    row.appendChild(document.createElement("span"));
    row.sync = v => { cb.checked = !!v; };
    return row;
  }

  const isInt = spec.type === "integer";
  const hasMin = (spec.minimum ?? spec.exclusiveMinimum) !== undefined;
  const hasMax = (spec.maximum ?? spec.exclusiveMaximum) !== undefined;
  const min = spec.minimum ?? spec.exclusiveMinimum ?? 0;
  const max = spec.maximum ?? spec.exclusiveMaximum ?? 1;

  /* Whether this parameter gets a slider at all. Three reasons it should not:

     1. The parameter declares widget:"box" -- e.g. grid line width over
        0.5-6 px, where a slider is all travel and no precision.
     2. It has no finite bound. A saturation level declared `ge=0` with no
        maximum was getting a 0-1 slider with the value sitting at 250,
        permanently pinned off the end. A bar with no upper bound is not a
        bar, it is a lie.
     3. Its range spans orders of magnitude. Exposure time runs 30 us to
        100 ms; the useful band is a narrow slice of that, and a linear drag
        cannot resolve it. (A log slider would work, but the box is simpler
        and you already know the number you want.) */
  const wideRange = min >= 0 && max > 0 && max / Math.max(min, 1) > 500;
  const boxOnly = spec.widget === "box" || !hasMin || !hasMax || wideRange;

  const slider = document.createElement("input");
  slider.type = "range"; slider.min = min; slider.max = max;
  // step="any" for floats. A computed step such as (max-min)/1000 produces
  // values the browser then rejects as not on the step grid, because
  // 625 * 0.008 is not exactly 5 in binary floating point -- the slider goes
  // dead for no visible reason. Continuous is also what you want for sweeping.
  slider.step = isInt ? 1 : "any";
  slider.value = value;

  const box = document.createElement("input");
  box.type = "number";
  if (hasMin) box.min = min;
  if (hasMax) box.max = max;
  box.step = isInt ? 1 : "any";
  box.value = fmt(value, isInt);

  function setBoth(v) {
    if (!boxOnly) slider.value = v;
    box.value = fmt(v, isInt);
    box.classList.remove("bad");
  }

  // Guard against re-sending a value that is already in force. Three events
  // can each fire for one edit (input, change, blur) and the box also commits
  // on a debounce, so without this a single keystroke can post four times.
  let inFlight = null;
  async function submit(v) {
    if (!Number.isFinite(v)) { box.classList.add("bad"); return; }
    if (v === inFlight) return;
    inFlight = v;
    // Out-of-range values are sent anyway: the server owns validation and its
    // 422 states the real limit. Clamping here would hide the limit behind a
    // silent correction, which is how a control comes to look broken.
    try {
      const got = await commit(key, v);
      setBoth(got === undefined || got === null ? v : got);
    } catch (e) {
      box.classList.add("bad");
    } finally {
      if (inFlight === v) inFlight = null;
    }
  }
  const readBox = () => (isInt ? parseInt(box.value, 10) : parseFloat(box.value));

  const pushSlider = debounce(v => submit(v), 100);
  slider.oninput = () => {
    const v = isInt ? parseInt(slider.value, 10) : parseFloat(slider.value);
    box.value = fmt(v, isInt);
    pushSlider(v);
  };

  // The box commits on three paths on purpose. `change` alone is not enough:
  // it does not fire for a pasted or scripted value, and a user who types a
  // number and then walks away without pressing Enter would see nothing
  // happen. Debounced `input` covers typing, Enter and blur cover the rest.
  const pushBox = debounce(() => submit(readBox()), 500);
  box.oninput = () => { box.classList.remove("bad"); pushBox(); };
  box.onchange = () => submit(readBox());
  box.onblur = () => submit(readBox());
  box.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); box.blur(); } };

  if (boxOnly) {
    row.classList.add("boxonly");
  } else {
    row.appendChild(slider);
  }
  row.appendChild(box);
  row.sync = setBoth;
  return row;
}

function makePanel(title, type, bodyEl, collapsed = false) {
  const p = document.createElement("div");
  p.className = "panel" + (collapsed ? " collapsed" : "");
  const hdr = document.createElement("div");
  hdr.className = "hdr";
  hdr.innerHTML = `<span class="chev">${collapsed ? "▸" : "▾"}</span>` +
                  `<strong></strong><span class="type"></span><span class="ms"></span>`;
  hdr.querySelector("strong").textContent = title;
  hdr.querySelector(".type").textContent = type;
  hdr.onclick = () => {
    p.classList.toggle("collapsed");
    hdr.querySelector(".chev").textContent = p.classList.contains("collapsed") ? "▸" : "▾";
  };
  const body = document.createElement("div");
  body.className = "body";
  body.appendChild(bodyEl);
  p.append(hdr, body);
  return p;
}

/* -------------------------------------------------------------------------- */

async function buildSensorPanel(camId) {
  const body = document.createElement("div");
  let data;
  try { data = await jget(`/api/controls/${camId}`); } catch { data = { spec: {} }; }

  // libcamera advertises dozens of controls; all but a few are noise for this
  // rig and would bury the ones that matter.
  const WANTED = ["ExposureTime", "AnalogueGain", "AeEnable"];
  const spec = data.spec || {};
  const names = WANTED.filter(n => n in spec);
  if (!names.length) {
    body.innerHTML = `<div class="empty">This backend advertises no sensor controls.</div>`;
    return makePanel("Sensor", "driver", body, true);
  }
  const commit = async (key, v) => {
    try {
      const r = await jsend(`/api/controls/${camId}`, { controls: { [key]: v } });
      // The server echoes what the source settled on. Turning auto-exposure
      // off pins the exposure AE had converged to, and setting an exposure by
      // hand turns AE off -- both change controls the caller did not name, so
      // push the whole effective set back into the rows.
      syncSensorRows(camId, r.effective || {}, r.live || {});
      note(camId, `sensor ${key} = ${v}`, "ok");
      return (r.effective || {})[key] ?? v;
    } catch (e) { note(camId, `sensor ${key}: ${e.message}`, "err"); throw e; }
  };
  SENSOR_ROWS[camId] = {};
  for (const n of names) {
    const s = spec[n];
    const current = (data.requested || {})[n] ?? s.default ?? s.minimum ?? 0;
    const row = makeRow(n, s, current, commit);
    SENSOR_ROWS[camId][n] = row;
    body.appendChild(row);
  }
  return makePanel("Sensor", "driver", body, false);
}

async function buildPipelinePanels(camId, host) {
  const stages = await jget(`/api/pipeline/${camId}`);
  for (const st of stages) {
    const body = document.createElement("div");
    const props = (st.schema && st.schema.properties) || {};
    const commit = async (key, v) => {
      try {
        const got = await jsend(`/api/pipeline/${camId}/${st.name}`, { values: { [key]: v } });
        note(camId, `${st.name}.${key} = ${got[key]}`, "ok");
        if (st.type === "mla_grid_overlay") refreshSubaps(camId);
        return got[key];
      } catch (e) {
        note(camId, `${st.name}.${key}: ${e.message}`, "err");
        throw e;
      }
    };
    for (const [key, spec] of Object.entries(props)) {
      // widget:"hidden" is for parameters that are units rather than knobs --
      // the MLA reference resolution, which records which frame size pitch and
      // the offsets were measured against. Editable by hand it would only ever
      // be wrong.
      if (spec.widget === "hidden") continue;
      body.appendChild(makeRow(key, spec, st.values[key], commit));
    }
    const panel = makePanel(st.name, st.type, body, false);
    panel.dataset.stage = st.name;
    panel.dataset.cam = camId;
    host.appendChild(panel);
  }
}

async function refreshSubaps(camId) {
  const strip = document.querySelector(`[data-subaps="${camId}"]`);
  if (!strip) return;
  let info;
  try { info = await jget(`/api/subapertures/${camId}`); } catch { return; }
  if (!info.available || !info.enabled) { strip.classList.remove("on"); return; }
  strip.classList.add("on");
  for (const v of SUBAPS) {
    const cap = strip.querySelector(`[data-cap-for="${v}"]`);
    const view = info.views[v];
    if (cap) {
      cap.textContent = view
        ? `${v.replace("_", " ")} (${view.index[0]}, ${view.index[1]})`
        : v.replace("_", " ");
    }
  }
}

/* ---------------------------------------------------------------------------
   STORAGE

   The output directory is movable while the rig is running, because the SD
   card is the wrong place for a session and the right disk is often not
   plugged in when the application starts. Two consequences visible here:

     * the device list is re-read on a timer, so something plugged in five
       minutes ago appears without a reload;
     * there is a Release button and no Eject button. Unmounting someone's
       filesystem is not this application's business; what it can do is stop
       writing to the device, which is the part that has to happen before the
       disk comes out.
--------------------------------------------------------------------------- */
const gb = n => `${(n / 1e9).toFixed(1)} GB`;

function renderStorage(s) {
  const host = $("#storage-body");
  if (!host || !s) return;
  const a = s.active;
  const el = document.createElement("div");

  const head = document.createElement("div");
  head.className = "dev active";
  head.innerHTML = `
    <div class="top"><span class="name">Writing to</span>
      <span class="tag ${a.removable ? "rm" : ""}">${a.removable ? "external" : "internal"}</span>
      ${a.present ? "" : `<span class="tag rm">MISSING</span>`}</div>
    <div class="path"></div>
    <div class="foot"><span class="cap">${gb(a.free_bytes)} free of ${gb(a.total_bytes)}</span>
      <button class="ghost" id="storage-release" ${a.removable ? "" : "disabled"}>Release</button>
    </div>`;
  head.querySelector(".path").textContent = a.session_dir;
  el.appendChild(head);

  for (const d of s.devices) {
    const row = document.createElement("div");
    row.className = "dev" + (d.active ? " active" : "");
    const pct = Math.round(d.used_fraction * 100);
    row.innerHTML = `
      <div class="top"><span class="name"></span>
        ${d.removable ? `<span class="tag rm">removable</span>` : ""}
        ${d.active ? `<span class="tag on">in use</span>` : ""}
        <span class="tag">${d.fstype}</span></div>
      <div class="path"></div>
      <div class="bar"><i class="${pct > 92 ? "full" : ""}" style="width:${pct}%"></i></div>
      <div class="foot"><span class="cap">${gb(d.free_bytes)} free · ${pct}% used</span>
        <button data-use="${d.mount}" ${d.active || !d.writable ? "disabled" : ""}>
          ${d.writable ? "Use" : "read-only"}</button></div>`;
    row.querySelector(".name").textContent = d.label;
    row.querySelector(".path").textContent = `${d.mount}  →  ${d.target}`;
    el.appendChild(row);
  }

  if (a.notes && a.notes.length) {
    const n = document.createElement("div");
    n.className = "notes";
    n.textContent = a.notes.slice(-6).join("\n");
    el.appendChild(n);
  }

  host.innerHTML = "";
  host.appendChild(el);
}

async function refreshStorage() {
  try { renderStorage(await jget("/api/storage")); } catch { /* transient */ }
}

function buildStorageCard() {
  const card = document.createElement("section");
  card.className = "cam";
  card.innerHTML = `
    <div class="viewport">
      <h2><span class="ttl">Storage</span>
        <span class="sub">output device</span>
        <span class="stat" id="storage-stat">&mdash;</span></h2>
    </div>
    <div class="controls"><div class="panel"><div class="body" id="storage-body">
      <div class="empty">reading devices…</div>
    </div></div></div>`;

  card.addEventListener("click", async ev => {
    const use = ev.target.closest("[data-use]");
    const rel = ev.target.closest("#storage-release");
    if (!use && !rel) return;
    ev.target.disabled = true;
    try {
      const s = use
        ? await jsend("/api/storage/target", { path: use.dataset.use })
        : await jsend("/api/storage/release");
      renderStorage(s);
      log(`output → ${s.active.session_dir}`, "ok");
    } catch (e) {
      log(`storage: ${e.message}`, "err");
      refreshStorage();
    }
  });
  return card;
}

async function buildLive() {
  const gen = ++BUILD;
  const cams = await jget("/api/cameras");
  if (gen !== BUILD) return;
  const root = $("#cams");
  root.innerHTML = "";

  for (const cam of cams) {
    const card = document.createElement("section");
    card.className = "cam";

    const vp = document.createElement("div");
    vp.className = "viewport";
    vp.innerHTML = `
      <h2><span class="ttl"></span>
        <span class="sub"></span>
        <span class="stat" data-fps="${cam.cam_id}">&mdash;</span>
      </h2>
      <img class="view" src="/stream/${cam.cam_id}.mjpg" alt="preview">
      <div class="subaps" data-subaps="${cam.cam_id}">
        ${SUBAPS.map(v => `
          <div class="subap">
            <img data-tile="${cam.cam_id}/${v}" alt="${v}">
            <div class="cap" data-cap-for="${v}">${v.replace("_", " ")}</div>
          </div>`).join("")}
      </div>
      <div class="actions">
        <button data-save="raw"  data-cam="${cam.cam_id}">Save raw</button>
        <button class="ghost" data-save="view" data-cam="${cam.cam_id}">Save view</button>
        <span class="note" data-note="${cam.cam_id}"></span>
      </div>`;
    vp.querySelector(".ttl").textContent = cam.label || cam.cam_id;
    vp.querySelector(".sub").textContent = `${cam.cam_id} · ${cam.backend}`;

    const controls = document.createElement("div");
    controls.className = "controls";

    card.append(vp, controls);
    root.appendChild(card);

    controls.appendChild(await buildSensorPanel(cam.cam_id));
    if (gen !== BUILD) return;
    await buildPipelinePanels(cam.cam_id, controls);
    if (gen !== BUILD) return;
    refreshSubaps(cam.cam_id);
  }

  root.appendChild(buildStorageCard());
  refreshStorage();

  root.addEventListener("click", async ev => {
    const btn = ev.target.closest("[data-save]");
    if (!btn) return;
    const kind = btn.dataset.save, cam = btn.dataset.cam;
    note(cam, `saving ${kind}…`);
    btn.disabled = true;
    try {
      const r = await jsend(`/api/capture/${cam}/${kind}`);
      note(cam, `${r.file}  ${r.shape.join("×")} ${r.dtype}`, "ok");
    } catch (e) {
      note(cam, `save ${kind} failed: ${e.message}`, "err");
    } finally {
      btn.disabled = false;
    }
  });
}


/* ===========================================================================
   CALIBRATION DASHBOARD

   A separate mode, not a panel bolted onto the imaging view. Alignment and
   calibration are different jobs with different instruments: during alignment
   you stare at the image, during a calibration session you stare at coverage.
   Sharing one screen would mean every control on it is wrong half the time.

   Switching is free and reversible in both directions -- nothing is running
   yet, and once detection exists the switch will confirm before abandoning an
   open session rather than becoming a one-way door.
   =========================================================================== */

let MODE = "live";
/* Building a mode is asynchronous -- it awaits the schema for every stage of
   every camera -- and a mode switch part-way through would otherwise let the
   abandoned build finish and append its panels into the new layout. That is
   how the storage card ended up in the calibration rail. Every build carries
   the generation it started in and stops if it is no longer current. */
let BUILD = 0;
let DETECTING = false;   // declared here so renderReadiness can consult it
let CAL = null;          // settings object, mirrored from the server
let CAL_SCHEMA = null;
let readinessTimer = null;

/* Field limits and help text come from the pydantic schema, same as the
   pipeline panels: the server owns validation, the page owns layout. */
function resolveGroup(schema, key) {
  const ref = schema?.properties?.[key]?.$ref || schema?.properties?.[key]?.allOf?.[0]?.$ref;
  if (!ref) return {};
  const name = ref.split("/").pop();
  return schema.$defs?.[name]?.properties || {};
}

function calGroup(title, groupKey, fields) {
  const body = document.createElement("div");
  const props = resolveGroup(CAL_SCHEMA, groupKey);
  for (const f of fields) {
    const spec = props[f] || {};
    const commit = async (key, v) => {
      const next = JSON.parse(JSON.stringify(CAL));
      next[groupKey][key] = v;
      try {
        const r = await jsend("/api/calibration/settings", next, "PUT");
        CAL = r.settings;
        renderDerived(r.derived);
        log(`${groupKey}.${key} = ${r.settings[groupKey][key]}`, "ok");
        return r.settings[groupKey][key];
      } catch (e) {
        log(`${groupKey}.${key}: ${e.message}`, "err");
        throw e;
      }
    };
    body.appendChild(makeRow(f, spec, CAL[groupKey][f], commit));
  }
  return makePanel(title, groupKey, body, false);
}

function kpi(label, value, unit, cls = "") {
  return `<div class="kpi ${cls}"><div class="k">${label}</div>` +
         `<div class="v">${value}<span class="u">${unit || ""}</span></div></div>`;
}

function renderDerived(d) {
  const host = $("#cal-derived");
  if (!host || !d) return;
  const vclass = { ok: "ok", too_small: "warn", too_big: "warn", singular: "err" }[d.square_verdict];
  host.innerHTML =
    kpi("focal length", d.f_px, "px") +
    kpi("centre plane D", d.D_mm, "mm") +
    kpi("κ", d.kappa_px, "") +
    kpi("baseline", d.baseline_mm, "mm") +
    kpi("square on sensor", d.square_px, "px", vclass);
  const note = $("#cal-verdict");
  note.textContent = d.note || "";
  note.className = "verdict " + (d.square_verdict === "ok" ? "" :
                                 d.square_verdict === "singular" ? "err" : "warn");
}

function renderReadiness(r) {
  const host = $("#cal-checks");
  if (!host) return;
  host.innerHTML = "";
  for (const c of r.checks) {
    const cls = c.ok ? "pass" : (c.blocking ? "fail" : "warn");
    const mark = c.ok ? "✓" : (c.blocking ? "✕" : "!");
    const row = document.createElement("div");
    row.className = "chk " + cls;
    row.innerHTML = `<span class="mark">${mark}</span><span></span>`;
    row.lastChild.textContent = c.message;
    host.appendChild(row);
  }
  const btn = $("#cal-start");
  const why = $("#cal-why");
  if (btn) {
    btn.disabled = !r.ready || DETECTING;
    why.textContent = r.ready
      ? (r.warnings.length ? `${r.warnings.length} advisory warning(s)` : "preconditions met")
      : `blocked: ${r.blocking_failures.length} precondition(s)`;
    why.style.color = r.ready ? "" : "var(--err)";
  }
}

async function buildCalibration() {
  const gen = ++BUILD;
  const cams = await jget("/api/cameras");
  const cfg = await jget("/api/calibration/settings");
  if (gen !== BUILD) return;
  CAL = cfg.settings; CAL_SCHEMA = cfg.schema;

  const root = $("#cams");
  root.className = "cal";
  root.innerHTML = "";

  // ---- left rail: everything you set before a session -----------------
  const rail = document.createElement("div");
  rail.className = "rail";
  rail.appendChild(calGroup("Board", "board", ["cols", "rows", "square_mm"]));
  rail.appendChild(calGroup("Optics (nominal)", "optics",
    ["focal_length_mm", "lens_to_mla_mm", "mla_to_sensor_mm", "working_distance_mm"]));
  rail.appendChild(calGroup("Acceptance", "acceptance",
    ["min_corners_per_tile", "min_cross_tiles", "target_per_tile",
     "move_fraction", "move_rotation_deg"]));
  rail.appendChild(calGroup("Detection", "detection",
    ["interval_s", "overlay", "normalize_illumination", "high_accuracy"]));

  // Exposure and gain only. No pipeline, no MLA -- alignment is finished
  // before entering, and its parameters are frozen (shown below, read-only).
  for (const cam of cams) {
    const panel = await buildSensorPanel(cam.cam_id);
    if (gen !== BUILD) return;
    panel.querySelector(".hdr strong").textContent = `Sensor — ${cam.label || cam.cam_id}`;
    rail.appendChild(panel);
  }

  // ---- right: derived numbers, checks, live views, start --------------
  const stage = document.createElement("div");
  stage.className = "stage";
  stage.innerHTML = `
    <div>
      <div class="sectitle">What the nominal optics imply</div>
      <div class="derived" id="cal-derived" style="margin-top:8px"></div>
      <div class="verdict" id="cal-verdict" style="margin-top:8px"></div>
    </div>
    <div>
      <div class="sectitle">Preconditions</div>
      <div class="checks" id="cal-checks" style="margin-top:8px"></div>
    </div>
    <div>
      <div class="sectitle">Frozen alignment</div>
      <div class="frozen" id="cal-frozen" style="margin-top:6px"></div>
    </div>
    <div>
      <div class="sectitle">Live</div>
      <div class="calviews" id="cal-views" style="margin-top:8px"></div>
    </div>
    <div class="startbar">
      <button id="cal-start">Start detection</button>
      <button class="ghost" id="cal-stop" disabled>Stop</button>
      <span class="why" id="cal-why"></span>
      <span class="why" style="margin-left:auto">no images are recorded at this stage</span>
    </div>`;

  const views = stage.querySelector("#cal-views");
  for (const cam of cams) {
    const v = document.createElement("div");
    v.className = "calview";
    v.innerHTML = `<h3><span class="t"></span>
                     <span class="stat" data-fps="${cam.cam_id}">&mdash;</span></h3>
                   <img data-detimg="${cam.cam_id}" src="/stream/${cam.cam_id}.mjpg" alt="preview">
                   <div class="actions" style="display:block">
                     <div class="detstat idle" data-detstat="${cam.cam_id}">detection idle</div>
                     <div class="cov" data-cov="${cam.cam_id}"></div>
                     <div class="covkey">
                       <span><i style="background:var(--accent)"></i>cross</span>
                       <span><i style="background:var(--ok)"></i>found</span>
                       <span><i style="background:#4a2330"></i>nothing</span>
                       <span><i style="background:#1a1d26"></i>off sensor</span>
                     </div>
                     <span class="note" data-note="${cam.cam_id}"></span>
                   </div>`;
    v.querySelector(".t").textContent = cam.label || cam.cam_id;
    views.appendChild(v);
  }

  root.append(rail, stage);

  // The MLA parameters are what crop the micro-images, so they are shown but
  // not editable here: changing them mid-session would silently invalidate
  // every corner already recorded.
  const frozen = $("#cal-frozen");
  frozen.innerHTML = "";
  for (const cam of cams) {
    try {
      const stages = await jget(`/api/pipeline/${cam.cam_id}`);
      if (gen !== BUILD) return;
      const mla = stages.find(s => s.type === "mla_grid_overlay");
      const line = document.createElement("div");
      // Pitch is quoted twice on purpose. It is set in preview pixels, which
      // is what you aligned against, but detection runs on the sensor frame,
      // and that factor of two is the one number in this whole dashboard that
      // is worth being able to check at a glance.
      const rw = mla && mla.values.reference_width;
      const full = cam.info && cam.info.full_resolution;
      const k = rw && full ? full[0] / rw : 1;
      line.textContent = mla
        ? `${cam.cam_id}: pitch ${mla.values.pitch_px} px @${rw || "?"}w ` +
          `(= ${(mla.values.pitch_px * k).toFixed(1)} px on the sensor), ` +
          `rot ${mla.values.rotation_deg}°, ` +
          `offset (${mla.values.offset_x}, ${mla.values.offset_y}), ` +
          `crop ×${mla.values.crop_scale}, ` +
          `derotate ${mla.values.derotate_views ? "ON" : "off"}`
        : `${cam.cam_id}: no MLA stage`;
      frozen.appendChild(line);
    } catch { /* readiness will report it */ }
  }

  renderDerived(cfg.derived);

  $("#cal-start").onclick = async ev => {
    const btn = ev.currentTarget;
    btn.disabled = true;
    try {
      applyDetectionState(await jsend("/api/calibration/start"));
      log("detection running — corner finding only, nothing is being saved", "ok");
    } catch (e) {
      log(e.message, "err");
      btn.disabled = false;
    }
  };
  $("#cal-stop").onclick = async ev => {
    ev.currentTarget.disabled = true;
    try { applyDetectionState(await jsend("/api/calibration/stop")); log("detection stopped"); }
    catch (e) { log(e.message, "err"); }
  };

  // A reload mid-session must not lie about whether detection is running.
  try { applyDetectionState(await jget("/api/calibration/detection")); } catch { /* transient */ }

  await refreshReadiness();
  readinessTimer = setInterval(refreshReadiness, 2000);
}

/* ---------------------------------------------------------------------------
   Detection display.

   Two things are shown and they answer different questions. The annotated
   image answers "is it finding the pattern where I think the pattern is" --
   it is the frame the numbers were measured on, with the corners drawn at
   their measured positions. The coverage lattice answers "which part of the
   array is failing", which the image cannot: a dead column at one edge is
   obvious as a column of grey cells and invisible as a few missing boxes in a
   busy picture.
--------------------------------------------------------------------------- */

function applyDetectionState(state) {
  DETECTING = !!(state && state.running);
  const start = $("#cal-start"), stop = $("#cal-stop");
  if (start) start.disabled = DETECTING;
  if (stop) stop.disabled = !DETECTING;

  for (const img of document.querySelectorAll("[data-detimg]")) {
    const cam = img.dataset.detimg;
    if (DETECTING) {
      // Drop the MJPEG stream. Not only for the connection budget: the
      // annotated frame IS the live view while detecting, and showing an
      // unannotated stream beside a set of counts derived from a different
      // frame invites reading the two together.
      if (img.dataset.mode !== "det") { img.dataset.mode = "det"; img.removeAttribute("src"); }
    } else if (img.dataset.mode !== "stream") {
      img.dataset.mode = "stream";
      img.dataset.busy = "0";
      img.src = `/stream/${cam}.mjpg`;
    }
  }
  if (state) renderDetection(state);
}

function renderDetection(state) {
  for (const [camId, d] of Object.entries((state && state.cameras) || {})) {
    const line = document.querySelector(`[data-detstat="${camId}"]`);
    const cov = document.querySelector(`[data-cov="${camId}"]`);
    const r = d.result;
    if (line) {
      if (!r) {
        line.className = "detstat idle";
        line.textContent = d.running ? "waiting for the first pass…" : "detection idle";
      } else if (r.error) {
        line.className = "detstat"; line.style.color = "var(--err)";
        line.textContent = r.error;
      } else {
        line.className = "detstat" + (r.accepted ? "" : " idle");
        line.style.color = "";
        line.innerHTML =
          `<b>${r.tiles_found}</b>/${r.tiles_examined} tiles · ` +
          `<b>${r.cross_centres.length}</b> cross · ${r.pass_ms} ms · ` +
          (r.accepted ? "POSE WOULD BE ACCEPTED" : "no qualifying cross");
      }
    }
    if (cov && r && r.tiles && r.tiles.length) renderCoverage(cov, r);
  }
}

function renderCoverage(host, r) {
  const is = r.tiles.map(t => t.i), js = r.tiles.map(t => t.j);
  const i0 = Math.min(...is), i1 = Math.max(...is);
  const j0 = Math.min(...js), j1 = Math.max(...js);
  const cols = i1 - i0 + 1, rows = j1 - j0 + 1;
  const crosses = new Set(r.cross_centres.map(c => `${c[0]},${c[1]}`));

  // Rebuild only when the lattice extent changes; otherwise recolour in place.
  if (host.dataset.dims !== `${cols}x${rows}`) {
    host.dataset.dims = `${cols}x${rows}`;
    host.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    host.innerHTML = "";
    for (let n = 0; n < cols * rows; n++) host.appendChild(document.createElement("i"));
  }
  const cells = host.children;
  // Unset means "not a whole tile" -- a lattice position whose crop runs off
  // the sensor. Distinguishing that from "examined and found nothing" is the
  // point of the display: the second is a fault to chase, the first is just
  // the edge of the array.
  for (const c of cells) c.className = "";
  for (const t of r.tiles) {
    const idx = (t.j - j0) * cols + (t.i - i0);
    const cell = cells[idx];
    if (!cell) continue;
    cell.className = crosses.has(`${t.i},${t.j}`) ? "cross" : (t.found ? "found" : "miss");
    cell.title = `(${t.i}, ${t.j})  ` +
      (t.found ? `${t.n} corners` : (t.skipped ? "too flat to hold a pattern" : "no pattern"));
  }
}

/* Detection images are polled, like the sub-aperture tiles and for the same
   reason -- and at 1-2 Hz there is nothing worth streaming anyway. */
const DET_HZ = 3;
function pollDetection() {
  const next = () => setTimeout(pollDetection, 1000 / DET_HZ);
  if (MODE !== "cal" || !DETECTING) return next();
  for (const img of document.querySelectorAll('[data-detimg][data-mode="det"]')) {
    if (img.dataset.busy === "1") continue;
    img.dataset.busy = "1";
    const done = () => { img.dataset.busy = "0"; };
    img.onload = done;
    img.onerror = done;    // 204 before the first pass completes
    img.src = `/calibration/detection/${img.dataset.detimg}.jpg?t=${Date.now()}`;
  }
  jget("/api/calibration/detection")
    .then(s => { DETECTING = !!s.running; renderDetection(s); })
    .catch(() => {});
  next();
}

async function refreshReadiness() {
  if (MODE !== "cal") return;
  try { renderReadiness(await jget("/api/calibration/readiness")); } catch { /* transient */ }
}

async function setMode(mode) {
  if (mode === MODE) return;
  MODE = mode;
  if (readinessTimer) { clearInterval(readinessTimer); readinessTimer = null; }

  // Replacing <main> drops the <img> elements, which closes their MJPEG
  // connections. That matters: the browser's ~6-connection budget is the
  // constraint the whole streaming design is built around, and leaking a
  // stream per mode switch would exhaust it after three switches.
  for (const k of Object.keys(SENSOR_ROWS)) delete SENSOR_ROWS[k];
  const root = $("#cams");
  root.className = "";
  root.innerHTML = "";

  $("#mode-live").classList.toggle("on", mode === "live");
  $("#mode-cal").classList.toggle("on", mode === "cal");
  $("#live-actions").hidden = mode !== "live";

  try {
    if (mode === "cal") { await buildCalibration(); log("calibration mode"); }
    else { await buildLive(); log("imaging mode"); }
  } catch (e) {
    log(`${mode} mode failed to build: ${e.message}`, "err");
  }
}

$("#mode-live").onclick = () => setMode("live");
$("#mode-cal").onclick = () => setMode("cal");

async function saveAll(kind, btn) {
  // Feedback lands in three places on purpose: the button itself (so the
  // click is visibly acknowledged even before the write finishes), each
  // camera's own note line (so you see per-camera success or failure next to
  // the image it came from), and the footer (the full detail). A header
  // button whose result only appears in a footer reads as doing nothing.
  const original = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  for (const el of document.querySelectorAll("[data-note]")) {
    el.textContent = `saving ${kind}…`; el.className = "note";
  }
  log(`saving ${kind} on all cameras…`);
  try {
    const r = await jsend(`/api/capture-all/${kind}`);
    const failed = Object.values(r).some(v => v.error);
    for (const [cam, v] of Object.entries(r)) {
      note(cam, v.error ? `save ${kind} failed: ${v.error}`
                        : `${v.file}  ${v.shape.join("×")} ${v.dtype}`,
           v.error ? "err" : "ok");
    }
    log(Object.entries(r).map(([k, v]) => `${k}: ${v.file || v.error}`).join("   |   "),
        failed ? "err" : "ok");
    if (btn) { btn.textContent = failed ? "Save failed" : "Saved ✓"; }
  } catch (e) {
    log(e.message, "err");
    for (const el of document.querySelectorAll("[data-note]")) {
      el.textContent = e.message; el.className = "note err";
    }
    if (btn) btn.textContent = "Save failed";
  } finally {
    if (btn) setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 1400);
  }
}
$("#all-raw").onclick = ev => saveAll("raw", ev.currentTarget);
$("#all-view").onclick = ev => saveAll("view", ev.currentTarget);

/* Sub-aperture tiles are POLLED, not streamed.

   A browser allows roughly six concurrent connections per origin and an MJPEG
   stream holds one open indefinitely. Two cameras with a main stream plus
   three tile streams each is eight -- past the limit, at which point every
   fetch() on this page, including every button press, queues behind them and
   never returns. That failure looks exactly like dead controls.

   One persistent stream per camera for the main preview; everything else is a
   short request that completes and gives its connection back. */
const TILE_HZ = 4;
function pollTiles() {
  if (MODE !== "live") { setTimeout(pollTiles, 1000 / TILE_HZ); return; }
  for (const img of document.querySelectorAll("[data-tile]")) {
    // Skip while a previous load is still in flight, so a slow encode cannot
    // build a backlog of requests.
    if (img.dataset.busy === "1") continue;
    const strip = img.closest(".subaps");
    if (!strip || !strip.classList.contains("on")) continue;
    img.dataset.busy = "1";
    const done = () => { img.dataset.busy = "0"; };
    img.onload = done;
    img.onerror = done;   // 204 while the lenslet is off-sensor: keep the last frame
    img.src = `/subaperture/${img.dataset.tile}.jpg?t=${Date.now()}`;
  }
  setTimeout(pollTiles, 1000 / TILE_HZ);
}

let tick = 0;
async function poll() {
  try {
    const s = await jget("/api/status");
    const st = s.storage || {};
    const el = $("#session");
    el.textContent =
      `${s.session_dir}` +
      (st.free_gb !== undefined ? `   ${st.free_gb} GB free` : "") +
      `   up ${s.uptime_s}s` +
      (s.detection_running ? "   ● detecting" : "") +
      (st.present === false ? "   ⚠ OUTPUT DEVICE MISSING" : "");
    el.style.color = st.present === false ? "var(--err)" : "";
    for (const c of s.cameras) {
      const el = document.querySelector(`[data-fps="${c.cam_id}"]`);
      if (el) {
        el.textContent = `${c.fps} fps  ${c.frames} frames` + (c.errors ? `  ${c.errors} ERR` : "");
        el.style.color = c.errors ? "var(--err)" : "";
      }
      if (c.live) syncSensorRows(c.cam_id, {}, c.live);
    }
    // Sub-aperture indices shift as pitch changes; refresh captions at a low
    // rate rather than on every keystroke.
    tick++;
    if (MODE === "live" && tick % 3 === 0) s.cameras.forEach(c => refreshSubaps(c.cam_id));
    // Devices appear and disappear on their own schedule, so the panel is
    // re-read on a timer rather than only when something is clicked.
    if (MODE === "live" && tick % 5 === 0) refreshStorage();
  } catch (e) { /* transient; the streams themselves show a stall */ }
  setTimeout(poll, 1000);
}

buildLive().then(() => { poll(); pollTiles(); pollDetection(); })
          .catch(e => log("startup: " + e.message, "err"));
</script>
