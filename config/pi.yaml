      #
      # min_corners: roughly two thirds of (cols+2)x(rows+2) for your board --
      # the Preconditions panel says what yours implies.
      # min_contrast: grey levels a corner must be worth. 40 rejects sensor
      # noise; a printed board gives 130+.
      - {type: checkerboard_presence, name: presence,
         params: {enabled: true, min_corners: 20, min_contrast: 40.0}}
