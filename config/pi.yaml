# Rig configuration for the Pi 5 with two IMX296 global shutter cameras.
#
# `index` comes from scripts/probe_cameras.py. On a Pi 5, connector CAM0 is
# usually index 0, but confirm rather than assume -- libcamera orders by bus
# address, and swapping the ribbon cables swaps the indices.

log_level: INFO

server:
  host: 0.0.0.0
  port: 8000
  # Preview frames pushed to the browser per second. Deliberately far below
  # the sensor rate: the Pi 5 encodes JPEG in software, and two streams at
  # sensor rate would starve the capture threads.
  preview_fps: 12
  jpeg_quality: 80

storage:
  # Point this at a USB SSD or an NVMe HAT. Sustained image capture to the SD
  # card is slow and wears it out.
  root: ~/trilobite-data
  still_format: npy

cameras:
  - cam_id: left
    label: Left camera
    backend: picamera2
    index: 0
    full_resolution: [1456, 1088]     # IMX296 native, BEFORE any rotation
    preview_resolution: [728, 544]
    fps: 30                           # what the SENSOR produces
    # Orientation, applied at acquisition to the preview AND to every saved
    # frame. rotate_deg is clockwise on screen, 0/90/180/270 only, and is
    # applied before the two mirrors, so the mirrors always mean "flip what I
    # see". 90 and 270 swap width and height everywhere downstream; the sizes
    # above stay sensor-native and describe() reports the turned ones. An MLA
    # alignment is carried across a change here rather than invalidated -- a
    # turn moves no lenslets -- but re-check the overlay by eye.
    rotate_deg: 0
    flip_horizontal: false
    flip_vertical: false
    # How often the PIPELINE runs. null follows server.preview_fps (12 here),
    # which is the only rate anything consumes. The sensor is still drained at
    # `fps` -- it has to be, or the request pool starves -- but stats, levels,
    # the overlay and the ~3 ms presence map are not run on every one of those
    # frames. 0 processes all of them, which is what made parameter edits feel
    # a second late.
    process_fps: null
    controls:
      # Fixed exposure and gain. Auto-exposure makes frames incomparable,
      # which defeats the purpose of a calibration rig.
      #
      # No AwbEnable: these are the MONO IMX296, which has no colour
      # processing, so libcamera advertises no white-balance control at all.
      # Unsupported names are now dropped with a warning instead of aborting
      # startup, but leaving one in the config is still noise.
      AeEnable: false
      ExposureTime: 8000              # microseconds
      AnalogueGain: 1.0
    pipeline:
      - {type: stats,      name: stats}
      - {type: levels,     name: display, params: {gain: 1.0, gamma: 1.0}}
      # pitch_px, offset_x and offset_y are FULL-RESOLUTION SENSOR pixels --
      # 1456 x 1088 here, not the 728 x 544 preview you align against. The
      # overlay scales down to draw; nothing that measures converts anything.
      # The grid must be enabled and its pitch/offsets set to the real MLA
      # before calibration will start -- readiness blocks on both. 20 px is
      # a placeholder, not a measurement.
      - {type: mla_grid_overlay, name: mla, params: {enabled: false, pitch_px: 20}}
      # Live checkerboard presence, for the hands-free capture loop. Costs
      # about 3 ms per preview frame and needs no camera access of its own.
      # Must come AFTER the MLA stage: it counts into that grid.
      #
      # ON by default, and deliberately. It shipped off, which is why the first
      # field session reported "no board is being noticed": the calibration
      # page started, the preview ran, and nothing ever counted anything. There
      # was no error because a disabled stage is a legal no-op. Readiness now
      # refuses to start the capture loop if this stage is missing or off.
      #
      # min_corners: roughly two thirds of (cols+2)x(rows+2) for your board --
      # the Preconditions panel says what yours implies.
      # min_contrast: grey levels a corner must be worth. 40 rejects sensor
      # noise; a printed board gives 130+.
      - {type: checkerboard_presence, name: presence,
         params: {enabled: true, min_corners: 20, min_contrast: 40.0}}

  - cam_id: right
    label: Right camera
    backend: picamera2
    index: 1
    full_resolution: [1456, 1088]     # IMX296 native, BEFORE any rotation
    preview_resolution: [728, 544]
    fps: 30                           # what the SENSOR produces
    # Orientation, applied at acquisition to the preview AND to every saved
    # frame. rotate_deg is clockwise on screen, 0/90/180/270 only, and is
    # applied before the two mirrors, so the mirrors always mean "flip what I
    # see". 90 and 270 swap width and height everywhere downstream; the sizes
    # above stay sensor-native and describe() reports the turned ones. An MLA
    # alignment is carried across a change here rather than invalidated -- a
    # turn moves no lenslets -- but re-check the overlay by eye.
    rotate_deg: 0
    flip_horizontal: false
    flip_vertical: false
    # How often the PIPELINE runs. null follows server.preview_fps (12 here),
    # which is the only rate anything consumes. The sensor is still drained at
    # `fps` -- it has to be, or the request pool starves -- but stats, levels,
    # the overlay and the ~3 ms presence map are not run on every one of those
    # frames. 0 processes all of them, which is what made parameter edits feel
    # a second late.
    process_fps: null
    controls:
      AeEnable: false
      ExposureTime: 8000
      AnalogueGain: 1.0
    pipeline:
      - {type: stats,      name: stats}
      - {type: levels,     name: display, params: {gain: 1.0, gamma: 1.0}}
      # pitch_px, offset_x and offset_y are FULL-RESOLUTION SENSOR pixels --
      # 1456 x 1088 here, not the 728 x 544 preview you align against. The
      # overlay scales down to draw; nothing that measures converts anything.
      # The grid must be enabled and its pitch/offsets set to the real MLA
      # before calibration will start -- readiness blocks on both. 20 px is
      # a placeholder, not a measurement.
      - {type: mla_grid_overlay, name: mla, params: {enabled: false, pitch_px: 20}}
      # Live checkerboard presence, for the hands-free capture loop. Costs
      # about 3 ms per preview frame and needs no camera access of its own.
      # Must come AFTER the MLA stage: it counts into that grid.
      #
      # ON by default, and deliberately. It shipped off, which is why the first
      # field session reported "no board is being noticed": the calibration
      # page started, the preview ran, and nothing ever counted anything. There
      # was no error because a disabled stage is a legal no-op. Readiness now
      # refuses to start the capture loop if this stage is missing or off.
      #
      # min_corners: roughly two thirds of (cols+2)x(rows+2) for your board --
      # the Preconditions panel says what yours implies.
      # min_contrast: grey levels a corner must be worth. 40 rejects sensor
      # noise; a printed board gives 130+.
      - {type: checkerboard_presence, name: presence,
         params: {enabled: true, min_corners: 20, min_contrast: 40.0}}
