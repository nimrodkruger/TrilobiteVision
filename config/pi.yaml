      # Live checkerboard presence, for the hands-free capture loop. Costs
      # about 3 ms per preview frame and needs no camera access of its own.
      # Must come AFTER the MLA stage: it counts into that grid.
      #
      # ON by default, and deliberately. It shipped off, which is why the first
      # field session reported "no board is being noticed": the calibration
      # page started, the preview ran, and nothing ever counted anything. There
      # was no error because a disabled stage is a legal no-op. Readiness now
