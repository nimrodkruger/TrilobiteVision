[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trilobitevision"
version = "0.1.0"
description = "Dual-camera capture, processing and browser preview for a Raspberry Pi 5 optics rig"
requires-python = ">=3.11"

# Deliberately excludes picamera2, numpy and opencv. On the Pi those come from
# apt (see scripts/install_pi.sh) because the libcamera Python bindings are not
# pip-installable and version skew between pip and apt builds is the single
# most common way to break a working camera stack.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Desktop-only: everything needed to run the synthetic/replay backends, and the
# calibration corner detector, on a machine with no Pi attached.
#
# opencv-python-headless, not opencv-python: the GUI build drags in Qt and a
# display stack nothing here uses. On the **Pi this extra must not be
# installed** -- cv2 comes from apt as python3-opencv, built against the same
# numpy that picamera2's buffers use. A pip wheel alongside it gives two cv2
# modules and an import order that silently decides which one you get.
desktop = ["numpy>=1.24", "pillow>=10.0", "opencv-python-headless>=4.9"]
# httpx is here deliberately, not incidentally. fastapi.testclient needs an
# HTTP client at import time, and it happened to be installed because
# something else had pulled it in -- so the API tests passed here and failed to
# import at all in a freshly resolved environment during an external review. A
# test dependency satisfied by luck is not satisfied.
#
# playwright drives the retained browser scenarios in tests/browser/. They skip
# when it is absent, so `pip install -e '.[dev]'` still gives a green suite
# without downloading a browser; CI installs it so the UI checks are executed
# rather than merely described.
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27", "playwright>=1.44"]

[project.scripts]
trilobite = "trilobite.__main__:main"

# `include` is explicit, not a bare `where = ["src"]`. Package discovery over
# the whole of src/ picked up a second, older capture-and-storage stack that
# was still sitting in the tree, so `pip install -e .` shipped both. One
# application, one package.
[tool.setuptools.packages.find]
where = ["src"]
include = ["trilobite*"]

[tool.setuptools.package-data]
"trilobite.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
